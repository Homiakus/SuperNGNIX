worker_processes 4;

events {
    use epoll;
    worker_connections 65535;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # F-Stack Userspace Networking Directive
    # Direct DPDK Poll-Mode Driver binding
    fstack {
        conf /opt/edgegate/dpdk/config/fstack.ini;
        lcore_mask 0x0e;
        freebsd_boot {
            hz 100;
            fd_reserve 1024;
            kern.ipc.maxsockets 1048576;
            kern.ipc.somaxconn 65535;
            net.inet.tcp.delayed_ack 0;
            net.inet.tcp.sendspace 65536;
            net.inet.tcp.recvspace 65536;
        };
    }

    sendfile off; # Not needed in zero-copy userspace mbuf memory
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    server {
        listen 80;
        server_name gate.gateway.internal;

        location / {
            return 200 "OK from EdgeGateway DPDK Userspace TCP Gateway\n";
        }

        location /api/v1/ {
            proxy_pass http://gateway_backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
