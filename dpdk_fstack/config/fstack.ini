[dpdk]
# Core mask for PMD (Poll Mode Driver) worker threads. Cores 1,2,3 dedicated for polling.
lcore_mask=0x0e
# Memory channels on motherboard
channel=4
# Number of HugePage memory in MB (4GB reserved for packet mbufs)
promiscuous=1
numa_on=1
# Hardware offloads
tx_csum_offload_enable=1
rx_csum_offload_enable=1
tso_enable=1
vlan_strip_enable=0

# Dedicated DPDK NIC port configuration
[port0]
addr=0000:03:00.0
pci_type=1
netmask=255.255.255.0
broadcast=192.168.10.255
gateway=192.168.10.1
ip=192.168.10.100

[freebsd.boot]
hz="100"
fd_reserve="1024"
kern.ipc.maxsockets="1048576"
kern.ipc.somaxconn="65535"
kern.ipc.nmbclusters="1048576"
net.inet.tcp.fast_finwait2_recycle="1"
net.inet.tcp.sendspace="65536"
net.inet.tcp.recvspace="65536"
net.inet.tcp.cc.algorithm="cubic"
net.inet.tcp.delayed_ack="0"
net.inet.raw.maxdgram="65536"
net.inet.raw.recvspace="65536"
